# Profilo "lowmem": cosa installano scripts/install.sh e scripts/install.ps1 quando viene
# richiesto con --profile lowmem (-Profile lowmem su Windows).
#
# AGENTS e SKILLS elencano, separati da spazio, i soli nomi da copiare nel progetto.
# Un valore vuoto significa "tutti", cioe' il comportamento del profilo predefinito.
# I nomi devono esistere in .opencode/agents e .opencode/skills del kit.
#
# Cambiando questi valori cambia anche cio' che va dichiarato in profiles/lowmem/AGENTS.md
# e nei permessi di profiles/lowmem/opencode.jsonc: i tre file vanno tenuti allineati.

AGENTS="architect-planner backend-developer code-quality-reviewer"
SKILLS="springboot"
